<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <rect width="400" height="400" fill="#FDF4F0"/>
  <!-- L'Parallel Skirt -->
  <g transform="translate(80, 60)">
    <!-- Waistband -->
    <rect x="60" y="0" width="120" height="30" rx="4" fill="#C9A890"/>
    <!-- Skirt body - A-line -->
    <path d="M60 30 L20 320 L220 320 L180 30 Z" fill="#DDB89A"/>
    <!-- Pleats -->
    <line x1="100" y1="30" x2="80" y2="320" stroke="#C9A890" stroke-width="1.5" opacity="0.6"/>
    <line x1="120" y1="30" x2="120" y2="320" stroke="#C9A890" stroke-width="1.5" opacity="0.6"/>
    <line x1="140" y1="30" x2="160" y2="320" stroke="#C9A890" stroke-width="1.5" opacity="0.6"/>
    <!-- Hem detail -->
    <line x1="20" y1="310" x2="220" y2="310" stroke="#C9A890" stroke-width="2"/>
  </g>
</svg>
